apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-ingress
  namespace: usermgmt-02230138
spec:
  ingressClassName: nginx
  rules:
    - host: usermgmt-02230138.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 80